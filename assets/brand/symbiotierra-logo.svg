<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2FA84F" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Icon Group -->
  <g transform="translate(20, 15) scale(1.1)" filter="url(#glow)">
    <!-- Main Leaf Body (Verde Clorofila #2FA84F) -->
    <path d="M 25 105 C 10 75 18 35 60 18 C 95 3 115 15 118 18 C 115 45 95 95 48 108 C 38 111 28 110 25 105 Z" 
          fill="#2FA84F" />
    <!-- Leaf Center Vein -->
    <path d="M 35 95 Q 65 65 95 38" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Blue Technological Droplet / Apex Circle (#1E6FEB) -->
    <circle cx="120" cy="18" r="10.5" fill="#1E6FEB" />
    <circle cx="118" cy="15.5" r="3" fill="#FFFFFF" opacity="0.6" />
  </g>
  <!-- Wordmark -->
  <text x="180" y="96" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="52" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Symbio</tspan><tspan fill="#2FA84F">Tierra</tspan>
  </text>
  <!-- Subtitle Slogan -->
  <text x="182" y="124" font-family="'Inter', sans-serif" font-weight="500" font-size="14.5" fill="#9CA3AF" letter-spacing="1.5">
    REESCRIBIENDO EL CÓDIGO DE LA NATURALEZA
  </text>
</svg>
